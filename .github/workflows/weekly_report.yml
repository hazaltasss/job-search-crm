name: 📬 Weekly Job Search Digest (Monday)

on:
  schedule:
    # Monday 08:00 CET (06:00 UTC in summer / 07:00 UTC in winter)
    - cron: '0 6 * * 1'
  workflow_dispatch:   # Allow manual trigger

jobs:
  weekly-report:
    name: Send Weekly Analytics Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Restore cached jobs.db
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ runner.os }}
          restore-keys: |
            jobs-db-

      - name: 📊 Generate weekly analytics report
        env:
          GOOGLE_SHEET_ID:      ${{ secrets.GOOGLE_SHEET_ID }}
          GCP_SA_KEY_B64:       ${{ secrets.GCP_SA_KEY_B64 }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/weekly_report.py
